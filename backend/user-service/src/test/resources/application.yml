server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    default-property-inclusion: non_null

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: unit-test-only-secret-key-0123456789abcdef0123456789abcdef

logging:
  level:
    com.realtimeleaderboard.user: DEBUG
