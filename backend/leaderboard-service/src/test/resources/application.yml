spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaStreamsAutoConfiguration

  data:
    redis:
      host: localhost
      port: 6379

  main:
    allow-bean-definition-overriding: true

  websocket:
    allowed-origins: http://localhost:8080

eureka:
  client:
    enabled: false

jwt:
  secret: unit-test-only-secret-key-0123456789abcdef0123456789abcdef

internal:
  service-secret: test-internal-secret

leaderboard:
  supported-sports: FOOTBALL,CRICKET,F1
  default-top-limit: 10
  max-top-limit: 100
  default-page-size: 20
  max-page-size: 100
  default-nearby-range: 2
  max-nearby-range: 10
  processed-score-ttl-hours: 72
  websocket:
    top-n: 10

websocket:
  allowed-origins: http://localhost:8080

logging:
  level:
    com.realtimeleaderboard.leaderboard: INFO
