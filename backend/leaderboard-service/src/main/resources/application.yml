server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: leaderboard-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: leaderboard-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.realtimeleaderboard.score.kafka,com.realtimeleaderboard.leaderboard.kafka"
        spring.json.value.default.type: com.realtimeleaderboard.leaderboard.kafka.ScoreSubmittedEvent
    topic:
      score-submitted: ${KAFKA_TOPIC_SCORE_SUBMITTED:leaderboard.score.submitted}
      score-submitted-dlt: ${KAFKA_DLT_TOPIC_SCORE_SUBMITTED:leaderboard.score.submitted.DLT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

jwt:
  secret: ${JWT_SECRET}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

leaderboard:
  supported-sports: FOOTBALL,CRICKET,F1
  default-top-limit: 10
  max-top-limit: 100
  default-page-size: 20
  max-page-size: 100
  default-nearby-range: 2
  max-nearby-range: 10
  processed-score-ttl-hours: 72
  websocket:
    top-n: 10

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
