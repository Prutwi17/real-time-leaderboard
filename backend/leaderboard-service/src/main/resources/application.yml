server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: leaderboard-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

leaderboard:
  supported-sports: FOOTBALL,CRICKET,F1
  default-top-limit: 10
  max-top-limit: 100
  default-page-size: 20
  max-page-size: 100
  default-nearby-range: 2
  max-nearby-range: 10
  processed-score-ttl-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
